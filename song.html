<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090c">
  <title>Song — PHONKVERSE</title>
  <meta property="og:site_name" content="PHONKVERSE"><meta property="og:type" content="music.song">
  <link rel="stylesheet" href="css/style.css?v=globe-7">
  <link rel="stylesheet" href="css/song.css?v=2">
</head>
<body class="song-page">
  <div class="powered-bar">
    <a class="powered-by" href="https://radiopumpo.github.io" target="_blank" rel="noopener" aria-label="Powered by Radio Pumpo">
      <span>Powered by</span><img src="assets/images/radiopumpo-logo.jpg" alt="Radio Pumpo" width="28" height="28" decoding="async">
    </a>
  </div>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="PHONKVERSE home"><span class="brand-mark">♛</span><span>PHONKVERSE</span></a>
    <a class="header-cta" id="back-link" href="index.html#albums">← Album</a>
  </header>
  <main class="song">
    <canvas id="synth" aria-hidden="true"></canvas>
    <div class="song-panel">
      <div class="song-head">
        <div class="song-head-text">
          <p class="song-kicker"><span id="song-album">PHONKVERSE</span> · <span id="song-num">01 / 07</span></p>
          <h1 id="song-title">Loading…</h1>
        </div>
        <a class="song-art" id="song-art" href="index.html#albums" title="View album">
          <img id="song-art-img" alt="" width="1536" height="1024" decoding="async">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </a>
      </div>
      <p class="song-mood" id="song-mood"></p>
      <p class="song-desc" id="song-desc"></p>

      <div class="timeline">
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Song timeline" disabled>
        <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
      </div>
      <div class="transport">
        <button id="prev" type="button" aria-label="Previous song">⏮</button>
        <button id="play" type="button" class="play" aria-label="Play">▶</button>
        <button id="next" type="button" aria-label="Next song">⏭</button>
        <button id="share" type="button" class="share">Share this song ↗</button>
      </div>
      <p class="song-status" id="song-status" role="status" aria-live="polite"></p>
    </div>
  </main>
  <script type="module" src="js/song/index.js"></script>
  <script src="js/bgm.js"></script>
</body>
</html>
